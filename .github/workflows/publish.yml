name: Publish
# Mirrored from invisit's private repository. Publishes @invisitdev/web, @invisitdev/server and
# the invisit installer CLI to npm when their package.json carries a version npm doesn't have
# yet. Trusted publishing (OIDC): no npm token exists, and every release carries provenance.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    name: 'packages/${{ matrix.package }}'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: [web, server, cli]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        run: |
          name="$(jq -r .name package.json)"
          version="$(jq -r .version package.json)"
          published=false
          npm view "$name@$version" version >/dev/null 2>&1 && published=true
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          {
            echo "name=$name"
            echo "version=$version"
            echo "published=$published"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.published == 'false'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: steps.version.outputs.published == 'false'
        run: bun install --frozen-lockfile
        working-directory: .
      - if: steps.version.outputs.published == 'false'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - if: steps.version.outputs.published == 'false'
        env:
          DIST_TAG: ${{ steps.version.outputs.tag }}
        run: |
          bun run build
          npm pkg delete devDependencies
          npm publish --access public --tag "$DIST_TAG"
      - env:
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISHED: ${{ steps.version.outputs.published }}
          TAG: ${{ matrix.package }}-v${{ steps.version.outputs.version }}
        run: |
          sha="$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 \
            || gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" >/dev/null
          if [ "$PUBLISHED" = true ]; then
            echo "$NAME@$VERSION is already on npm" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published $NAME@$VERSION (tag $TAG)" >> "$GITHUB_STEP_SUMMARY"
          fi
